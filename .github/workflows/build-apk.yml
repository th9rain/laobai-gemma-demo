name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify web demo assets
        run: node tools/verify-demo.mjs

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify model runtime and demo assets in APK
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("android/app/build/outputs/apk/debug/app-debug.apk")
          required = {
              "lib/arm64-v8a/liblitertlm_jni.so",
              "assets/always-on-form.html",
              "assets/trigger-health.html",
          }
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"APK is missing required files: {missing}")
          unexpected = sorted(name for name in names if name.startswith("lib/x86_64/"))
          if unexpected:
              raise SystemExit(f"APK unexpectedly contains x86_64 libraries: {unexpected[:5]}")
          print(f"Verified {apk} ({apk.stat().st_size:,} bytes)")
          for name in sorted(required):
              print(f"  contains {name}")
          PY

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/laobai-demo-debug.apk
          sha256sum artifacts/laobai-demo-debug.apk > artifacts/laobai-demo-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laobai-android-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
