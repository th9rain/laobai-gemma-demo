name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Copy APK into releases folder
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/laobai-gemma-demo-v0.2.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: laobai-gemma-demo-v0.2.0
          path: releases/laobai-gemma-demo-v0.2.0.apk
