<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>老白 Agent Web Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page" style="grid-template-columns:minmax(420px,720px);">
      <section class="operator">
        <h1>老白 Agent Web Demo</h1>
        <p>
          电脑端运行的手机竖屏模拟界面。Always-on 使用本地 Gemma E4B / LiteRT 截图坐标链路；Trigger 使用云端 Planner 历史回放加本地 Gemma Computer Use 执行。页面不展示 API Key，模型调用通过本地 server 代理。
        </p>
        <div class="operator-panel">
          <div class="model-row">
            <div>
              <strong>Demo 1：Always-on 自动填表</strong>
              <span>本地 Gemma 根据手机截图生成坐标动作，连续两页填写资料，并在提交前停止。</span>
            </div>
            <a class="primary-btn" href="./always-on-form.html?autostart=1" style="text-decoration:none; display:inline-grid; place-items:center;">打开</a>
          </div>
          <div class="model-row">
            <div>
              <strong>Demo 2：Trigger 看病挂号</strong>
              <span>用户点击老白浮窗触发对话，Planner 回放生成挂号计划，本地 Gemma 执行到确认页前停止。</span>
            </div>
            <a class="secondary-btn" href="./trigger-health.html?autostart=1" style="text-decoration:none; display:inline-grid; place-items:center;">打开</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
